<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tesla Model Y — лоти</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--fg:#141826;--mut:#6b7285;--line:#e4e8f2;--chip:#eef1f8;--acc:#4f46e5;--ok:#059669;--bad:#e11d48;--warn:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0d1020;--card:#161a2e;--fg:#eef0f7;--mut:#959bb2;--line:#262b45;--chip:#1f2440}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.5 -apple-system,system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:340px minmax(0,1fr);height:100vh}
.list{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.lhead{padding:12px;border-bottom:1px solid var(--line)}
.lhead input{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.lhead .mut{margin-top:6px}
.items{overflow:auto;flex:1}
.it{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.it:hover{background:var(--bg)}.it.act{background:rgba(79,70,229,.14)}
.it img,.it .ni{width:84px;height:63px;object-fit:cover;border-radius:8px;background:var(--chip)}
.it .t{font-weight:700;font-size:13px}.it .s{font-size:12px;color:var(--mut);line-height:1.35}
.main{overflow:auto;padding:20px 24px}
.box{max-width:1000px;margin:0 auto}
.top{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px}
@media (max-width:1100px){.top{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h1{font-size:17px;margin:0 0 2px}h2{font-size:16px;margin:0 0 12px}
.mut{color:var(--mut);font-size:12.5px}
.gal{display:grid;grid-template-columns:1fr;gap:8px}
.gal .big{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--chip)}
.thumbs{display:flex;gap:6px;overflow-x:auto}.thumbs{flex-wrap:wrap}.thumbs img{width:58px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.75}.thumbs img.on{opacity:1;outline:2px solid var(--acc)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.facts div b{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.links a{margin-right:12px;color:var(--acc);font-weight:600;text-decoration:none}
.note{margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(217,119,6,.12);color:var(--warn);font-size:13px}
table{width:100%;border-collapse:collapse}
td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{width:28px;color:var(--mut);font-weight:700}
td.v{width:170px;text-align:right}
td input{width:150px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;text-align:right}
td .h{font-size:12px;color:var(--mut)}
tr.tot td{border:0;font-size:18px;font-weight:800;padding-top:14px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--chip);margin-right:6px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.empty{color:var(--mut);text-align:center;padding:60px 0}
@media (max-width:820px){.wrap{grid-template-columns:1fr;height:auto}.list{max-height:45vh}.main{padding:14px}}
</style></head><body>
<div class="wrap">
 <aside class="list">
  <div class="lhead"><input id="q" placeholder="Пошук: номер лота, VIN, посилання, штат"><div class="mut" id="cnt"></div></div>
  <div class="items" id="items"></div>
 </aside>
 <section class="main"><div class="box" id="view"><div class="empty">Виберіть машину зі списку зліва</div></div></section>
</div>
<script src="caucasus.js?v=202611171"></script>
<script src="lots.js?v=202611172100"></script>
<script>
const $=id=>document.getElementById(id),L=window.LOTS,C=L.cols;
const fmt=v=>'$'+Math.round(v||0).toLocaleString('uk-UA');
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const when=c=>{const m=(c||'').match(/(\d+) (\w{3}), (\d+):(\d+)/);return m?new Date(Date.UTC(2026,MON[m[2]],+m[1],+m[3]-2,+m[4])):null;};
// Центри штатів (широта, довгота) — щоб показати відстань до Нью-Йорка (порт)
const GEO={AL:[32.8,-86.8],AZ:[34.2,-111.7],AR:[34.9,-92.4],CA:[36.8,-119.4],CO:[39,-105.5],CT:[41.6,-72.7],DE:[39,-75.5],FL:[28.6,-82.4],GA:[32.7,-83.4],ID:[44.4,-114.6],IL:[40,-89.2],IN:[39.9,-86.3],IA:[42.1,-93.5],KS:[38.5,-98.4],KY:[37.5,-85.3],LA:[31,-92],ME:[45.4,-69.2],MD:[39,-76.8],MA:[42.3,-71.8],MI:[44.3,-85.4],MN:[46.3,-94.3],MS:[32.7,-89.7],MO:[38.4,-92.5],MT:[47,-109.6],NE:[41.5,-99.8],NV:[39.3,-116.6],NH:[43.7,-71.6],NJ:[40.2,-74.7],NM:[34.4,-106.1],NY:[42.9,-75.5],NC:[35.6,-79.4],ND:[47.5,-100.5],OH:[40.3,-82.8],OK:[35.6,-97.5],OR:[43.9,-120.6],PA:[40.9,-77.8],RI:[41.7,-71.5],SC:[33.9,-80.9],SD:[44.4,-100.2],TN:[35.9,-86.4],TX:[31.5,-99.3],UT:[39.3,-111.7],VT:[44.1,-72.7],VA:[37.5,-78.9],WA:[47.4,-120.5],WV:[38.6,-80.6],WI:[44.6,-89.9],WY:[43,-107.5],HI:[20.8,-156.3],AK:[64,-150],DC:[38.9,-77]};
const NY=[40.7,-74];
const miles=st=>{const g=GEO[st];if(!g)return null;const R=3959,r=x=>x*Math.PI/180,dl=r(g[0]-NY[0]),dn=r(g[1]-NY[1]);const a=Math.sin(dl/2)**2+Math.cos(r(NY[0]))*Math.cos(r(g[0]))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(a))*1.2);};
// Доставка «під ключ до Львова» за тарифами Любе Авто: суша + море 1000 + документи 50 + електро 100 + Литва 410 + Клайпеда→Львів 750 + МКП/брокер/менеджер 375
const FIXED=1000+50+100+350+25+35+750+25+200+150;
function land(r){const st=(r.loc.match(/\(([A-Z]{2})\)/)||[])[1],city=r.loc.replace(/\s*\([A-Z]{2}\)\s*$/,'').toUpperCase().trim(),auc=r.lot[0]==='1'?'Copart':'IAAI',T=window.CAUCASUS.ship[auc]||{};
 const k=st&&(Object.keys(T).find(k=>k===st+'|'+city)||Object.keys(T).find(k=>k.startsWith(st+'|'+city)));
 if(k)return {v:Math.max(150,Math.round(T[k]-1004)),how:'оцінка за майданчиком'};
 const mi=miles(st);if(mi==null)return {v:800,how:'майданчик невідомий'};return {v:Math.round(Math.max(300,mi*0.45)/10)*10,how:'оцінка за відстанню'};}
function fee(auc,p){const t=window.CAUCASUS.fees[auc];if(p<=t[0][0])return t[0][1];for(let i=1;i<t.length;i++)if(p<=t[i][0]){const[x0,y0]=t[i-1],[x1,y1]=t[i];return y0+(y1-y0)*(p-x0)/(x1-x0);}const[x0,y0]=t.at(-2),[x1,y1]=t.at(-1);return y1+(y1-y0)*(p-x1)/(x1-x0);}

const rows=L.rows.map(a=>Object.fromEntries(C.map((c,i)=>[c,a[i]]))).filter(r=>{const v=r.vin||'';return v[7]==='E'&&/^(2025|2026)/.test(r.name||'2026')&&(v[9]==='S'||v[5]==='D');});
rows.forEach(r=>{r.t=when(r.close);r.st=(r.loc||'').match(/\(([A-Z]{2})\)/)?.[1]||'';r.yr=({S:2025,T:2026})[(r.vin||'')[9]]||'';});
rows.sort((a,b)=>(a.t?0:1)-(b.t?0:1)||(a.t&&b.t?a.t-b.t:0));
const now=Date.now();let cur=null;
const S=JSON.parse(localStorage.getItem('calc2')||'{}');const save=()=>localStorage.setItem('calc2',JSON.stringify(S));
const img=(r,i=1)=>r.img?(i===1?r.img:r.img.replace(/-1\.jpg$/,`-${i}.jpg`)):null;
const auc=r=>r.lot[0]==='1'?'Copart':'IAAI';
function renderList(){const q=$('q').value.trim().toLowerCase().replace(/^.*\/lot\//,'').split('/')[0];
 const list=rows.filter(r=>(!r.t||r.t>now-3*3600e3)&&(!q||[r.lot,r.vin,r.loc,r.lot.slice(2)].some(x=>(x||'').toLowerCase().includes(q))));
 $('cnt').textContent=`${list.length} машин · AWD, Premium, 2025–2026 · найближчі торги зверху`;
 $('items').innerHTML=list.map(r=>`<div class="it${cur===r?' act':''}" data-l="${r.lot}">${img(r)?`<img loading="lazy" src="${img(r)}" onerror="this.style.visibility='hidden'">`:'<div class="ni"></div>'}<div><div class="t">${r.yr} · ${auc(r)} ${r.lot.slice(2)}</div><div class="s">${r.loc||''}<br>${r.dmg||''} · ${r.odo!=null?r.odo.toLocaleString('uk-UA')+' mi':''}<br>${r.close?r.close.replace(' GMT+2',''):'торги не призначено'}</div></div></div>`).join('')||'<div class="empty">Нічого не знайдено</div>';
 $('items').querySelectorAll('.it').forEach(e=>e.onclick=()=>open(e.dataset.l));}
function open(lot){cur=rows.find(r=>r.lot===lot)||L.rows.map(a=>Object.fromEntries(C.map((c,i)=>[c,a[i]]))).find(r=>r.lot===lot);if(!cur)return;location.hash=lot;renderList();renderView();}
function renderView(){const r=cur,n=(L.photos||{})[r.lot]||1,st=r.st||(r.loc||'').match(/\(([A-Z]{2})\)/)?.[1]||'',mi=miles(st),ld=land(r),s=S[r.lot]||{};
 const links=[r.lot[0]==='1'?['Copart',`https://www.copart.com/lot/${r.lot.slice(2)}`]:['IAAI',(L.iaai||{})[r.lot]?`https://www.iaai.com/VehicleDetail/${L.iaai[r.lot]}~US`:`https://www.iaai.com/Search?Keyword=${r.lot.slice(2)}`],['bid.cars',`https://bid.cars/ua/lot/${r.lot}/${(r.vin||'').includes('?')?'x':r.vin}`]];
 $('view').innerHTML=`<div class="card"><h1>${r.yr} Tesla Model Y · ${auc(r)} ${r.lot.slice(2)}</h1><div class="mut">VIN ${r.vin||'—'}</div>
  <div class="top" style="margin-top:10px"><div class="gal">${img(r)?`<img class="big" id="big" src="${img(r)}">`:''}${n>1?`<div class="thumbs">${Array.from({length:n},(_,i)=>`<img src="${img(r,i+1)}" data-i="${i+1}" class="${i?'':'on'}" onerror="this.remove()">`).join('')}</div>`:''}</div>
  <div><div class="facts">
   <div><b>Торги</b>${r.close?r.close.replace(' GMT+2',' (Київ)'):'не призначено'}</div><div><b>Майданчик</b>${r.loc||'—'}</div>
   <div><b>Пошкодження</b>${r.dmg||'—'}</div><div><b>Пробіг</b>${r.odo!=null?r.odo.toLocaleString('uk-UA')+' миль ('+Math.round(r.odo*1.609).toLocaleString('uk-UA')+' км)':'—'}</div>
   <div><b>Документ</b>${r.docFull||r.doc||'невідомо'}</div><div><b>Ключ</b>${r.key==='Present'?'<span class="ok">є</span>':r.key==='Missing'?'<span class="bad">немає</span>':'—'}</div>
   <div><b>Запуск</b>${r.start||'—'}</div><div><b>Продавець</b>${r.seller||'—'}</div>
   ${r.estMin?`<div><b>Оцінка bid.cars</b>${fmt(r.estMin)} – ${fmt(r.estMax)}</div>`:''}
  </div>
  ${(L.notes||{})[r.lot]?`<div class="note">${L.notes[r.lot]}</div>`:''}
  <div class="links" style="margin-top:12px">${links.map(([t,h])=>`<a href="${h}" target="_blank" rel="noopener">${t} ↗</a>`).join('')}</div></div></div></div>
 <div class="card"><h2>Розрахунок</h2><table>
  <tr><td class="n">1</td><td>Вартість лоту</td><td class="v"><input id="c_bid" type="number" step="100" value="${s.bid??''}" placeholder="ставка"></td></tr>
  <tr><td class="n">2</td><td>Штат<div class="h">${st||'—'}${mi!=null?` · ~${mi.toLocaleString('uk-UA')} миль до Нью-Йорка (порт)`:''}</div></td><td class="v">${st||'—'}</td></tr>
  <tr><td class="n">3</td><td>Доставка до Львова<div class="h">суша ${fmt(ld.v)} (${ld.how}) + море, Литва, Клайпеда → Львів, брокер ${fmt(FIXED)} — тарифи Любе Авто</div></td><td class="v"><input id="c_del" type="number" step="50" value="${s.del??(ld.v+FIXED)}"></td></tr>
  <tr><td class="n">4</td><td>Збір аукціону ${auc(r)}<div class="h">рахується від ставки за таблицею ${auc(r)}; можна змінити</div></td><td class="v"><input id="c_fee" type="number" step="10"></td></tr>
  <tr><td class="n">5</td><td>Мито 20%<div class="h">20% від вартості лоту</div></td><td class="v" id="c_duty"></td></tr>
  <tr><td class="n">6</td><td>Ремонт</td><td class="v"><input id="c_rep" type="number" step="100" value="${s.rep??''}" placeholder="0"></td></tr>
  <tr class="tot"><td></td><td>Разом</td><td class="v" id="c_tot"></td></tr>
 </table></div>`;
 const big=$('big');$('view').querySelectorAll('.thumbs img').forEach(t=>t.onclick=()=>{big.src=t.src;$('view').querySelectorAll('.thumbs img').forEach(x=>x.classList.toggle('on',x===t));});
 const v=id=>+$(id).value||0;let feeManual=s.fee!=null;
 const calc=()=>{const bid=v('c_bid');if(!feeManual)$('c_fee').value=bid?Math.round(fee(auc(r),bid)):'';const duty=bid*0.2;$('c_duty').textContent=fmt(duty);
  $('c_tot').textContent=fmt(bid+v('c_del')+v('c_fee')+duty+v('c_rep'));
  S[r.lot]={bid:$('c_bid').value||undefined,del:+$('c_del').value!==ld.v+FIXED?$('c_del').value:undefined,fee:feeManual?$('c_fee').value:undefined,rep:$('c_rep').value||undefined};save();};
 if(feeManual)$('c_fee').value=s.fee;
 $('c_fee').oninput=()=>{feeManual=$('c_fee').value!=='';calc();};
 ['c_bid','c_del','c_rep'].forEach(id=>$(id).oninput=calc);calc();}
$('q').oninput=()=>{renderList();const q=$('q').value.match(/([01]-\d{6,})/);if(q&&rows.find(r=>r.lot===q[1]))open(q[1]);};
renderList();if(location.hash.length>2)open(decodeURIComponent(location.hash.slice(1)));
</script></body></html>
